# =============================================================================
# Config for the transmission-mode classification & source decomposition.
# Classify each outbreak common-source (static correct) vs propagated (renewal
# correct) vs mixed, assign a source fraction theta, and run the static<->renewal
# bracket at theta. Reuses the renewal/static/DALY engines.
# =============================================================================

seed: 123
renewal_config: "renewal/config.yml"

paths:
  tables:  "source_decomposition/tables"
  figures: "source_decomposition/figures"
  outputs: "source_decomposition/outputs"

# Incubation-period distribution for the common-source (Stream B) fit.
# Typhoid incubation ~10-14 d (BMC Infect Dis 2018 subgroup means 9.7-21.2 d).
incubation:
  mean_days: 12
  sd_days: 6
  mean_days_range: [10, 14]      # for the theta_data interval

# Base vaccination scenario for the decomposition bracket.
scenario:
  tau_weeks: 8
  coverage: 0.80

# theta range by classified mode (source fraction; 1 = pure common-source).
theta_by_mode:
  A_common_source: [0.7, 1.0]
  C_mixed:         [0.3, 0.7]
  B_propagated:    [0.0, 0.3]
